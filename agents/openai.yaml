interface:
  display_name: "solo-2611 单轮 Feedback 本地交付"
  short_description: "26.11 三领域最新分类：困难题设计门禁、单轮执行、窗口录屏、证据化 Feedback 和 19 列交付表"
  default_prompt: "使用 $solo-2611 完成一道困难题：先从配置读取 SOLO2 账号的唯一大类并保持只读，再按真实工程选择该大类下匹配的子方向；无法匹配时拒绝建题或提交。先读真实项目并做题面与难度门禁，再执行单轮、生成可读的 ASCII GitHub 项目名并保留快照和轨迹、按窗口录屏。交付完整性默认高质量上限为 4；只有填写并通过严格满分审计时才可评 5。基于证据起草 Feedback 并交专家复核，最后导出 19 列交付表。"
